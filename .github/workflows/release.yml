name: Build & Release

# Runs whenever main changes. If VERSION holds a version that has no release yet,
# it builds MacroMaker.exe on Windows and publishes a GitHub Release with the .exe attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: |
          VER="v$(tr -d ' \r\n' < VERSION)"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VER already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Smoke test (start, hide to tray, restore, quit)
        if: steps.ver.outputs.exists == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          pip install -r requirements.txt
          python -c "
          import main, traceback
          app = main.App()
          errors = []
          def on_error(*exc):
              errors.append(exc)
              traceback.print_exception(*exc)
          app.report_callback_exception = on_error
          app.after(1500, app._hide_to_tray)
          app.after(2500, app._show_from_tray)
          app.after(3000, app._jiggle_panel._toggle)
          app.after(4000, app._jiggle_panel._toggle)
          app.after(5000, app._quit)
          app.mainloop()
          assert not errors, 'errors during smoke test'
          print('smoke test passed')
          "

      - name: Build MacroMaker.exe
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name MacroMaker \
            --icon icon.ico --add-data "icon.ico;." \
            --hidden-import pynput.keyboard._win32 \
            --hidden-import pynput.mouse._win32 \
            --hidden-import pystray._win32 \
            --collect-all customtkinter \
            main.py

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES=$(awk -v v="${TAG#v}" '$0 ~ "^- \\*\\*" v "\\*\\*" {sub(/^- \*\*[^*]+\*\* — /, ""); print}' README.md)
          gh release create "$TAG" dist/MacroMaker.exe --title "MacroMaker $TAG" --notes "${NOTES:-MacroMaker $TAG}" --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
